modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Patchouli is detected reflectively and is never required. Declaring it as an optional
# dependency with ordering=AFTER makes Forge construct and dispatch lifecycle events to Patchouli
# before us, which is what PatchouliGuideAdapter.tryInit() needs to find the API classes. It does
# NOT guarantee BookRegistry is populated — books are loaded during resource/datapack load, after
# common setup — so the custom-item map stays lazily built and is invalidated by
# PatchouliReloadHandler on every datapack sync. Do not remove that laziness.
# Curios is optional. ordering=AFTER guarantees Curios is constructed and its lifecycle events
# dispatched before ours, so CuriosApi and its capabilities are initialised by the time
# ModIntegrations.setupAll() runs during our commonSetup. Without Curios the slot/entity datapack
# files load into nothing and no Curios-typed class is ever classloaded.
[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=false
    versionRange="[5.9.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="patchouli"
    mandatory=false
    versionRange="[1.20.1,)"
    ordering="AFTER"
    side="BOTH"
