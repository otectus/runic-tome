plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: "${mapping_version}"

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        // Curios ships mixins whose refmap is written in SRG names. A ForgeGradle dev run uses
        // named mappings, so without these two properties Mixin looks up f_19803_ in a class that
        // calls it firstTick and Curios fails to apply, taking the whole run down. output.srg comes
        // from ForgeGradle's own createSrgToMcp task. Only needed because a *dependency* has
        // mixins -- this mod has none of its own.
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    // Curios API. Note this is TheIllusiveC4's own maven, NOT BlameJared.
    maven {
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
    }
    // Phase 2: Patchouli (CurseMaven or vazkii maven). Enable when Phase 2 starts.
    // maven { url = 'https://maven.blamejared.com' }
    // maven {
    //     url = 'https://www.cursemaven.com'
    //     content { includeGroup 'curse.maven' }
    // }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Curios is optional at runtime. The ':api' jar has no mods.toml and cannot be loaded as a
    // mod, so the full jar is needed for runClient/runGameTestServer; the api jar is all we
    // compile against. Every class naming a Curios type sits behind CuriosSupport's ModList gate.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    // Phase 2: Patchouli (pin exact version at implementation time)
    // implementation fg.deobf("vazkii.patchouli:Patchouli:1.20.1-84-FORGE")

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// Reproducible builds: identical sources must produce a byte-identical jar (RT-17). Previously the
// manifest embedded `new Date()`, evaluated at configuration time, so every build differed and the
// jar could not be verified against its sources by a third party.
//
// SOURCE_DATE_EPOCH is the cross-ecosystem convention for "the timestamp a reproducible build should
// claim". When a release pipeline sets it the attribute is emitted from that value in UTC; when it
// is absent (a normal local build) the attribute is omitted entirely rather than filled with the
// wall clock, because a timestamp nobody can reproduce is worse than no timestamp.
def sourceDateEpoch = System.getenv('SOURCE_DATE_EPOCH')

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar).configure {
    def manifestAttributes = [
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : mod_id,
            'Implementation-Version': mod_version,
            'Implementation-Vendor' : mod_authors,
    ]
    if (sourceDateEpoch) {
        manifestAttributes['Implementation-Timestamp'] = new Date(sourceDateEpoch.toLong() * 1000L)
                .format("yyyy-MM-dd'T'HH:mm:ssZ", TimeZone.getTimeZone('UTC'))
    }
    manifest {
        attributes(manifestAttributes)
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
